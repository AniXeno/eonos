[package]
name = "eonos"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "eonos"
path = "src/main.rs"
test = false
bench = false

[dependencies]
limine = "=0.5.0"
spin = "0.9"

[features]
default = []
debug-logs = []

[profile.dev]
panic = "abort"
opt-level = 0
debug = true

[profile.release]
panic = "abort"
opt-level = 2
lto = true
debug = false
strip = true
